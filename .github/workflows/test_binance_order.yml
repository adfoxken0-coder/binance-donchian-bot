name: Test Binance Testnet Order

# 只能手動觸發,不會自動排程執行。用假訊號在測試網真的下一次單,
# 驗證下單、槓桿計算、停損停利掛單的完整流程。
#
# 安全機制:force_test_order.py 內部的 get_client() 會強制檢查
# BINANCE_TESTNET 這組 Secret 是否為 true,不是的話會直接報錯拒絕執行,
# 不會因為這個workflow而繞過「只能在測試網用」的限制。
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "要測試的交易對"
        required: true
        default: "BTCUSDT"
        type: choice
        options:
          - BTCUSDT
          - ETHUSDT
      direction:
        description: "測試方向"
        required: true
        default: "long"
        type: choice
        options:
          - long
          - short

# 跟正式的BTC/ETH排程workflow共用同一個並行控制群組,因為三者共用
# risk_state.json / position_tracker.json / trade_stats.json 這幾個狀態檔案
concurrency:
  group: trading-bot-risk-state
  cancel-in-progress: false

permissions:
  contents: write   # 需要寫入權限,才能把狀態檔案的更新推回 repo

jobs:
  send-test-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force test order on testnet
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python force_test_order.py --symbol ${{ inputs.symbol }} --direction ${{ inputs.direction }} --yes

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add risk_state.json position_tracker.json trade_stats.json
          git diff --staged --quiet || git commit -m "Update trading state from test order [skip ci]"
          git pull --rebase origin main
          git push
