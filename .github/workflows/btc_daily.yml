name: BTC Daily Donchian Strategy

on:
  schedule:
    # 全天24小時、每20分鐘執行一次。策略本身仍然只看「最新一根已收盤的日線K棒」,
    # 頻繁執行不會產生更多訊號,只是縮短K棒收盤到程式偵測到的延遲時間
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # 允許手動點擊執行,方便測試

# 跟 ETH workflow 共用同一個並行控制群組,因為兩者共用 risk_state.json,
# 避免兩個workflow同時觸發時,一起搶著commit同一個檔案造成衝突
concurrency:
  group: trading-bot-risk-state
  cancel-in-progress: false

permissions:
  contents: write   # 需要寫入權限,才能把 risk_state.json 的更新推回 repo

jobs:
  run-btc-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BTC strategy
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --symbol BTCUSDT --interval 1d

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add risk_state.json position_tracker.json trade_stats.json
          git diff --staged --quiet || git commit -m "Update trading state [skip ci]"
          git pull --rebase origin main
          git push
